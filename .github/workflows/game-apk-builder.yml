name: Build game APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: write
concurrency:
  group: game-apk-builder
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package game assets
        run: python3 .tv-apk/tools/package-game.py
      - name: Build signed APK
        working-directory: .tv-apk
        env:
          GAME_KEY_BASE64: ${{ secrets.GAME_APK_KEYSTORE }}
          GAME_KEY_PASSWORD: ${{ secrets.GAME_APK_PASSWORD }}
          GAME_KEY_PATH: ${{ runner.temp }}/game-signing.p12
        run: |
          test -n "$GAME_KEY_BASE64"
          printf '%s' "$GAME_KEY_BASE64" | base64 --decode > "$GAME_KEY_PATH"
          gradle --no-daemon :app:assembleDebug
          rm -f "$GAME_KEY_PATH"
      - name: Verify signer and prepare download
        run: |
          cp .tv-apk/app/build/outputs/apk/debug/app-debug.apk game.apk
          signer_expected="$(tr -d '\r\n' < .tv-apk/signing-certificate.sha256)"
          signer_actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs game.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$signer_expected" = "$signer_actual"
          node -e "const fs=require('fs'),c=require('crypto');fs.writeFileSync('update.json',JSON.stringify({versionCode:100000+Number(process.env.GITHUB_RUN_NUMBER),sha256:c.createHash('sha256').update(fs.readFileSync('game.apk')).digest('hex')}))"
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: game.apk
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view game-apk-latest >/dev/null 2>&1; then
            gh release create game-apk-latest --target "$GITHUB_SHA" --title "TV game APK" --notes "Signed Fire OS 7+ APK. Source and packaging configuration are in this repository."
          fi
          gh release upload game-apk-latest game.apk update.json --clobber
