name: Build Fire TV app
on:
  workflow_dispatch:
  push:
    paths: ['fire-tv/**', '.github/workflows/fire-tv-apk.yml', 'index.html']
permissions:
  contents: write
concurrency:
  group: fire-tv-build
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: fire-tv
        env:
          FIRE_TV_KEYSTORE_BASE64: ${{ secrets.FIRE_TV_KEYSTORE_BASE64 }}
          FIRE_TV_SIGNING_PASSWORD: ${{ secrets.FIRE_TV_SIGNING_PASSWORD }}
          FIRE_TV_KEYSTORE_PATH: ${{ runner.temp }}/fire-tv-signing.p12
        run: |
          test -n "$FIRE_TV_KEYSTORE_BASE64"
          printf '%s' "$FIRE_TV_KEYSTORE_BASE64" | base64 --decode > "$FIRE_TV_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleDebug
          rm -f "$FIRE_TV_KEYSTORE_PATH"
      - name: Name APK
        run: cp fire-tv/app/build/outputs/apk/debug/app-debug.apk call-of-doom-fire-tv.apk
      - name: Verify permanent APK signer
        run: |
          signer_expected="$(tr -d '\r\n' < fire-tv/signing-certificate.sha256)"
          signer_actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs call-of-doom-fire-tv.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$signer_expected" = "$signer_actual"
          cp call-of-doom-fire-tv.apk call-of-doom-fire-tv-v0.2.1.apk
      - name: Prepare game content update
        run: |
          cp index.html game.html
          node -e "const fs=require('fs'),crypto=require('crypto');fs.writeFileSync('game-update.json',JSON.stringify({version:Number(process.env.GITHUB_RUN_NUMBER),minAppVersion:2,sha256:crypto.createHash('sha256').update(fs.readFileSync('game.html')).digest('hex')}))"
      - uses: actions/upload-artifact@v4
        with:
          name: call-of-doom-fire-tv
          path: call-of-doom-fire-tv.apk
      - name: Publish installable test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view fire-tv-latest >/dev/null 2>&1; then
            gh release create fire-tv-latest --target "$GITHUB_SHA" --title "Fire TV app — test build" --notes "Installable Fire OS 7+ APK with native controller input. Internet required for web dependencies. Hardware testing pending. See fire-tv/README.md for installation."
          fi
          gh release upload fire-tv-latest call-of-doom-fire-tv.apk call-of-doom-fire-tv-v0.2.1.apk game.html --clobber
          gh release upload fire-tv-latest game-update.json --clobber
          gh release edit fire-tv-latest --title "Fire TV app v0.2.1" --notes "Native Xbox controller input, TV performance settings, and automatic game content updates. Install this APK once; future compatible game updates download on launch and apply on the next launch. Native app changes still need an APK install. See fire-tv/README.md."
